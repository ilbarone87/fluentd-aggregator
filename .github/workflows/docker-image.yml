name: Docker Image CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FLUENTD_VERSION: "1.19.1"
  FLUENTD_DEBIAN_REVISION: "2.1"
  IMAGE_REVISION: "1.0"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BASE_IMAGE=fluent/fluentd:v${{ env.FLUENTD_VERSION }}-debian-${{ env.FLUENTD_DEBIAN_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.repository }}
          tags: |
            type=raw,value=v${{ env.FLUENTD_VERSION }}-debian-${{ env.IMAGE_REVISION }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=fluent/fluentd:v${{ env.FLUENTD_VERSION }}-debian-${{ env.FLUENTD_DEBIAN_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FLUENTD_VERSION }}-debian-${{ env.IMAGE_REVISION }}
          name: v${{ env.FLUENTD_VERSION }}-debian-${{ env.IMAGE_REVISION }}
          body: |
            ## Docker Image
            ```bash
            docker pull ${{ github.repository }}:v${{ env.FLUENTD_VERSION }}-debian-${{ env.IMAGE_REVISION }}
            docker pull ${{ github.repository }}:latest
            ```

            ### Base Image
            - `fluent/fluentd:v${{ env.FLUENTD_VERSION }}-debian-${{ env.FLUENTD_DEBIAN_REVISION }}`

            See `Dockerfile` for the full list of installed plugins.
          generate_release_notes: true
          make_latest: true
